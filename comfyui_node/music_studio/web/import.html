<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dubbing Bay · ∞ TAPEDECK</title>
<style>
  :root { --bg:#07040e; --chassis:#130f1e; --chassis2:#1b1530;
          --pink:#ff2d95; --cyan:#00e5ff; --vfd:#39ffa0; --red:#ff3b4e;
          --text:#d8d4ea; --dim:#6f6a8a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:
      radial-gradient(1100px 700px at 20% -10%, #1c0f33, transparent),
      radial-gradient(900px 600px at 95% 0%, #0a1f2e, transparent), var(--bg);
    color:var(--text);
    font:15px/1.5 ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,monospace;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:1.8rem 1rem; }
  body::after { content:""; position:fixed; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent 0 2px,#00000030 2px 3px);
    mix-blend-mode:multiply; }
  h1 { font-size:1rem; font-weight:700; letter-spacing:.45em;
       text-transform:uppercase; color:var(--cyan);
       text-shadow:0 0 8px var(--cyan), 0 0 26px #00e5ff60; margin-bottom:1.5rem; }
  #panel { width:min(640px,94vw);
    background:linear-gradient(178deg,var(--chassis2),var(--chassis) 40%);
    border:1px solid #2c2347; border-top-color:#453a6b; border-radius:14px;
    padding:1.5rem; box-shadow:0 24px 70px #000c, inset 0 1px 0 #ffffff12; }
  label { font-size:.66rem; color:var(--dim); display:block; margin-bottom:.3rem;
          letter-spacing:.14em; text-transform:uppercase; }
  input[type=text] { width:100%; background:#0a0715; color:var(--vfd);
    border:1px solid #2c2347; border-radius:8px; padding:.65rem .85rem;
    font:inherit; font-size:.82rem; margin-bottom:.85rem;
    text-shadow:0 0 5px #39ffa070; }
  .row { display:flex; align-items:center; gap:.7rem; margin-bottom:1rem;
         font-size:.72rem; color:var(--dim); }
  button { background:linear-gradient(180deg,#2b2344,#171126 55%,#100b1d);
    color:var(--text); border:1px solid #3a2f60; border-top-color:#574a8a;
    border-radius:9px; padding:.7rem 1.2rem; font:inherit; font-size:.78rem;
    letter-spacing:.14em; text-transform:uppercase; cursor:pointer;
    box-shadow:0 3px 0 #0a0715, inset 0 1px 0 #ffffff14; }
  button:hover { filter:brightness(1.25); }
  button:active { transform:translateY(2px); box-shadow:0 1px 0 #0a0715; }
  button:disabled { opacity:.3; cursor:default; }
  #start { background:linear-gradient(180deg,#ff4fae,#c9187a 60%,#8f0f57);
    border-color:#ff67bb; color:#fff; font-weight:700;
    box-shadow:0 4px 0 #57063a, 0 0 22px #ff2d9550, inset 0 1px 0 #ffffff40; }
  #stages { margin:1.2rem 0 .5rem; }
  .stage { display:flex; align-items:center; gap:.6rem; padding:.32rem 0;
           font-size:.74rem; color:var(--dim); letter-spacing:.1em;
           text-transform:uppercase; }
  .stage .ico { width:1.2rem; text-align:center; }
  .stage.running { color:var(--cyan); text-shadow:0 0 7px var(--cyan); }
  .stage.done { color:var(--vfd); }
  .stage.failed { color:var(--red); }
  .stage.skipped { color:#8d6fe8; }
  .barwrap { background:#0a0715; border:1px solid #241c3d; border-radius:3px;
             height:9px; overflow:hidden; margin:.3rem 0 .15rem; }
  .bar { height:100%; width:0; transition:width .5s;
    background:linear-gradient(90deg,var(--pink),var(--cyan));
    -webkit-mask:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px);
            mask:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px); }
  .barlabel { display:flex; justify-content:space-between; font-size:.66rem;
              color:var(--dim); margin-bottom:.8rem; }
  #track-name { max-width:70%; overflow:hidden; text-overflow:ellipsis;
                white-space:nowrap; }
  #log { background:#020806; border:1px solid #1c3a2b; border-radius:8px;
         padding:.65rem .85rem; font-size:.64rem; line-height:1.5;
         color:#23c078; text-shadow:0 0 4px #23c07850; max-height:11em;
         overflow-y:auto; white-space:pre-wrap;
         box-shadow:inset 0 0 16px #000d; }
  a { color:var(--dim); font-size:.7rem; text-decoration:none; margin-top:1.1rem;
      letter-spacing:.12em; text-transform:uppercase; }
  a:hover { color:var(--cyan); text-shadow:0 0 7px var(--cyan); }
</style>
</head>
<body>
  <h1>⏺ Dubbing Bay</h1>
  <div id="panel">
    <label for="source">Music library directory (local path or mounted share)</label>
    <input type="text" id="source" 
           placeholder="/path/to/your/music">
    <div class="row">
      <input type="checkbox" id="captions" checked>
      <label for="captions" style="margin:0">describe every track with the
        listening model (slow — auto-skips if the captioner is busy)</label>
    </div>
    <div class="row">
      <button id="start">⏺ capture library</button>
      <button id="cancel" disabled>cancel</button>
    </div>

    <div id="stages"></div>

    <label>Current stage</label>
    <div class="barwrap"><div class="bar" id="stagebar"></div></div>
    <div class="barlabel"><span id="track-name">—</span><span id="track-count"></span></div>

    <label>Total capture</label>
    <div class="barwrap"><div class="bar" id="totalbar"></div></div>
    <div class="barlabel"><span id="state-label">idle</span><span id="total-pct"></span></div>

    <div id="log"></div>
  </div>
  <a href="index.html">⏮ back to the deck</a>

<script>
const $ = id => document.getElementById(id);
const ICONS = { pending:"○", running:"◐", done:"●", failed:"✗", skipped:"◌" };

async function poll() {
  let s;
  try { s = await (await fetch("/music_studio/import/status")).json(); }
  catch (e) { return; }
  const running = s.state === "running";
  $("start").disabled = running;
  $("cancel").disabled = !running;
  $("state-label").textContent = s.state || "idle";
  $("total-pct").textContent = s.overall_pct != null ? s.overall_pct + "%" : "";
  $("totalbar").style.width = (s.overall_pct || 0) + "%";
  $("totalbar").style.background = (s.state === "failed" || s.state === "died")
    ? "var(--red)" : "";
  const st = $("stages");
  st.innerHTML = "";
  for (const stage of (s.stages || [])) {
    const d = document.createElement("div");
    d.className = "stage " + stage.state;
    d.innerHTML = `<span class="ico">${ICONS[stage.state] || "○"}</span>` +
                  `<span>${stage.name}</span>`;
    st.appendChild(d);
  }
  if (s.track_n > 0) {
    $("stagebar").style.width = (s.track_i / s.track_n * 100) + "%";
    $("track-name").textContent = s.current_track || "—";
    $("track-count").textContent = `${s.track_i} / ${s.track_n}`;
  } else {
    $("stagebar").style.width = running ? "8%" : "0";
    $("track-name").textContent = running ? "working…" : "—";
    $("track-count").textContent = "";
  }
  $("log").textContent = (s.log || []).join("\n");
  $("log").scrollTop = $("log").scrollHeight;
}

$("start").onclick = async () => {
  const r = await fetch("/music_studio/import/start", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ source: $("source").value,
                           with_captions: $("captions").checked }),
  });
  const j = await r.json();
  if (j.error) alert(j.error);
  poll();
};
$("cancel").onclick = async () => {
  await fetch("/music_studio/import/cancel", { method: "POST" });
  poll();
};

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
